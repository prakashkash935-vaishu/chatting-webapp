<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOVEBOX Secrets 🎁</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="secrets.css">
</head>

<body>

    <div class="memories-page">

        <div class="memories-header">

            <h1>🎁 Our Secrets ❤️</h1>

            <button onclick="window.location.href='dashboard.html'">
                ← Back to Dashboard
            </button>

        </div>


        <div class="memory-form">

            <h2>🔐 Secret Message</h2>

            <label>Secret Title</label>

            <input type="text" id="secretTitle" placeholder="Enter secret title">

            <label>Your Secret</label>

            <textarea id="secretMessage" placeholder="Write your secret here... ❤️"></textarea>

            <button type="button" onclick="saveSecret()">
                Save Secret ❤️
            </button>

            <p id="secretStatus"></p>

        </div>


        <h2 class="gallery-title">
            💕 Saved Secrets
        </h2>

        <p id="secretCount">
            0 Secrets 🔐
        </p>

        <div id="secretList" class="memory-list"></div>

    </div>


    <script>

        // ===============================
        // SAVE SECRET
        // ===============================

        function saveSecret() {

            const title =
                document.getElementById("secretTitle").value.trim();

            const message =
                document.getElementById("secretMessage").value.trim();

            const status =
                document.getElementById("secretStatus");

            if (!title || !message) {

                status.textContent =
                    "Please fill all fields ❤️";

                return;
            }

            const secret = {
                title: title,
                message: message
            };

            let secrets =
                JSON.parse(
                    localStorage.getItem("loveboxSecrets")
                ) || [];

            secrets.push(secret);

            localStorage.setItem(
                "loveboxSecrets",
                JSON.stringify(secrets)
            );

            status.textContent =
                "Secret saved successfully! 🔐❤️";

            document.getElementById("secretTitle").value = "";
            document.getElementById("secretMessage").value = "";

            displaySecrets();
            updateSecretCount();
        }


        // ===============================
        // DISPLAY SECRETS
        // ===============================

        function displaySecrets() {

            const list =
                document.getElementById("secretList");

            let secrets =
                JSON.parse(
                    localStorage.getItem("loveboxSecrets")
                ) || [];

            list.innerHTML = "";

            secrets.forEach((secret, index) => {

                const card =
                    document.createElement("div");

                card.className = "memory-card";

                card.innerHTML = `
                    <h2>🔐 ${secret.title}</h2>

                    <p>${secret.message}</p>

                    <button
                        onclick="deleteSecret(${index})"
                        style="
                            margin:15px;
                            padding:10px 18px;
                            border:none;
                            border-radius:20px;
                            background:#e91e63;
                            color:white;
                            cursor:pointer;
                        ">
                        Delete 🗑️
                    </button>
                `;

                list.appendChild(card);

            });
        }


        // ===============================
        // DELETE SECRET
        // ===============================

        function deleteSecret(index) {

            let secrets =
                JSON.parse(
                    localStorage.getItem("loveboxSecrets")
                ) || [];

            secrets.splice(index, 1);

            localStorage.setItem(
                "loveboxSecrets",
                JSON.stringify(secrets)
            );

            displaySecrets();
            updateSecretCount();
        }


        // ===============================
        // SECRET COUNT
        // ===============================

        function updateSecretCount() {

            const secrets =
                JSON.parse(
                    localStorage.getItem("loveboxSecrets")
                ) || [];

            const count =
                document.getElementById("secretCount");

            count.textContent =
                `${secrets.length} Secrets 🔐`;
        }


        // ===============================
        // PAGE LOAD
        // ===============================

        displaySecrets();
        updateSecretCount();

    </script>

</body>

</html>
